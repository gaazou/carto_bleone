<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Canaux d'irrigation des ASA de la Bléone</title>

  <!-- CSS -->
  <link rel="stylesheet" href="reseau_bleone.css">

  <!-- Mapbox -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.4.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.4.1/mapbox-gl.css" rel="stylesheet" />

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet" />
</head>

<body>

<header>
  <a href="https://iut.univ-amu.fr/fr/formations/licences-professionnelles-desu/lp-cartographie-topographie-systemes-information-geographique">
    <img src="logo_amu.png" alt="logo_amu" class="logo_amu">
  </a>
</header>

<h1>Canaux d'irrigation des ASA de la Bléone</h1>

<main>
<section>

  <!-- CARTE -->
  <div id="map">

    <!-- PANNEAU DE COUCHES -->
    <div class="map-overlay-2">
      <div class="map-overlay-inner">

        <fieldset>
          <label class="categoryLabel">LP SIG HACKATON 2025</label>

          <div>
            <input type="checkbox" id="bleoneCB" onchange="switchlayer('bleone')">
            <label for="bleoneCB">Canaux d'irrigation</label>
          </div>
          <div>
            <input type="checkbox" id="asaCB" onchange="switchlayer('asa')">
            <label for="asaCB">ASA de la Bléone</label>
          </div>
          <div>
            <input type="checkbox" id="route-bleueCB" onchange="switchlayer('route-bleue')">
            <label for="route-bleueCB">Sentiers touristiques</label>
          </div>
          <div>
            <input type="checkbox" id="itineraireCB" onchange="switchlayer('itineraire')">
            <label for="itineraireCB">Itinéraires PDIPR</label>
          </div>
        </fieldset>

        <fieldset>
          <label class="categoryLabel">Équipements</label>

          <div><input type="checkbox" id="siphCB" onchange="switchlayer('siph')"> <label for="siphCB">Siphon</label></div>
          <div><input type="checkbox" id="reglCB" onchange="switchlayer('regl')"> <label for="reglCB">Règle</label></div>
          <div><input type="checkbox" id="partCB" onchange="switchlayer('part')"> <label for="partCB">Partiteur</label></div>
          <div><input type="checkbox" id="pompCB" onchange="switchlayer('pomp')"> <label for="pompCB">Pompe</label></div>
          <div><input type="checkbox" id="martCB" onchange="switchlayer('mart')"> <label for="martCB">Martelière</label></div>
          <div><input type="checkbox" id="degCB" onchange="switchlayer('deg')"> <label for="degCB">Dégrilleur</label></div>
          <div><input type="checkbox" id="aqCB" onchange="switchlayer('aq')"> <label for="aqCB">Aqueduc</label></div>
        </fieldset>

        <fieldset>
          <label class="categoryLabel">Topographie</label>

          <div><input type="checkbox" id="RPGCB" onchange="switchlayer('RPG')"> <label for="RPGCB">Occupation du sol</label></div>
          <div><input type="checkbox" id="hydrologieCB" onchange="switchlayer('hydrologie')"> <label for="hydrologieCB">Hydrologie</label></div>
          <div><input type="checkbox" id="Batiments_3DCB" onchange="switchlayer('Batiments_3D')"> <label for="Batiments_3DCB">Bâtiments 3D</label></div>
        </fieldset>

        <fieldset>
          <label class="categoryLabel">Fond de plan</label>

          <select id="basemap-select">
            <option value="mapbox://styles/mapbox/streets-v11">Streets</option>
            <option value="mapbox://styles/mapbox/outdoors-v11">Outdoors</option>
            <option value="mapbox://styles/mapbox/dark-v10">Dark</option>
            <option value="mapbox://styles/mapbox/satellite-v9">Satellite</option>
          </select>
        </fieldset>

      </div>
    </div>

  </div>

</section>
</main>

<footer>
  <a href="mailto:agathe.martinet@univ-amu.fr">Agathe MARTINET</a>
</footer>

<script src="reseau_bleone.js"></script>
</body>
</html>
